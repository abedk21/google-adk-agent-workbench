[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "google-adk-agent-workbench"
version = "0.1.0"
description = "Synthetic incident assistant with real Google ADK integration and offline deterministic tests"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
adk = ["google-adk>=2,<3"]

[tool.setuptools.packages.find]
include = ["agent_workbench*", "incident_adk*"]

[tool.setuptools.package-data]
agent_workbench = ["data.json"]
